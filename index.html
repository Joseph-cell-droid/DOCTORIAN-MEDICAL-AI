<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Doctorian Medical AI" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Doctorian Medical AI" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Doctorian - Autonomous Neural Healthcare Interface. Your personal AI-powered wellness ecosystem." />
    
    <!-- PWA Icons across Laptops, Smartphones, Tablets, and Smart Watches -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="icon" type="image/png" sizes="144x144" href="/logo-144.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/logo-96.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/logo-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logo-144.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/logo-96.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Preconnect to Google Fonts for efficient rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Apple Splash Screens -->
    <link rel="apple-touch-startup-image" href="/logo.png" />
    
    <title>Doctorian Medical AI</title>
    <script>
      // Capture PWA install prompt globally
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        console.log('[Doctorian PWA] beforeinstallprompt event captured globally.');
      });

      // Register the active PWA Service Worker for full offline capabilities
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('[Doctorian PWA] Service Worker registered successfully:', registration.scope);
            })
            .catch((error) => {
              console.error('[Doctorian PWA] Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; gap: 0.75rem;">
        <div style="width: 32px; height: 32px; border: 2.5px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <div style="font-weight: 700; letter-spacing: 0.05em; font-size: 11px; text-transform: uppercase; color: #64748b;">Loading Doctorian...</div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
          @media (prefers-color-scheme: dark) {
            #root > div { background: #0f172a !important; }
            #root > div > div:last-of-type { color: #94a3b8 !important; }
            #root > div > div:first-of-type { border-color: #1e293b !important; border-top-color: #3b82f6 !important; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
