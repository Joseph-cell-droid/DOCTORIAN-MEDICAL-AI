<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Doctorian Medical AI" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Doctorian Medical AI" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Doctorian - Autonomous Neural Healthcare Interface. Your personal AI-powered wellness ecosystem." />
    
    <!-- PWA Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Apple Splash Screens -->
    <link rel="apple-touch-startup-image" href="/logo.svg" />
    
    <title>Doctorian Medical AI</title>
    <script>
      // Clear legacy service workers that might interfere
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (const registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: white; font-family: sans-serif; gap: 1rem;">
        <div style="width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <div style="font-weight: 900; letter-spacing: 0.1em; font-size: 12px; text-transform: uppercase; opacity: 0.8;">Neural Core Initializing...</div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
