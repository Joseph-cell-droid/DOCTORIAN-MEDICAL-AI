<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Install Doctorian App Directly</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1.5rem;
      padding: 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 72px;
      height: 72px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      background: linear-gradient(to right, #2563eb, #0284c7);
      color: white;
      border: none;
      border-radius: 1rem;
      padding: 0.875rem 1.5rem;
      font-weight: 800;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);
      transition: transform 0.2s, background 0.2s;
    }
    .btn:hover {
      transform: scale(1.02);
      background: linear-gradient(to right, #1d4ed8, #0369a1);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.svg" alt="Doctorian AI" class="logo" />
    <h1>Install Doctorian App</h1>
    <p>Install Doctorian Autonomous Healthcare AI directly to your device home screen or desktop application list for 100% offline & standalone operation.</p>
    <button id="installBtn" class="btn">⚡ Install Directly to Device</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBtn').innerText = "⚡ Tap Here to Install App Now";
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          window.location.href = '/?mode=standalone';
        }
      } else {
        window.location.href = '/?install=true';
      }
    });
  </script>
</body>
</html>
