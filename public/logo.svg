<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Dark Blue Stethoscope Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2240" />
      <stop offset="50%" stop-color="#0d325c" />
      <stop offset="100%" stop-color="#07172e" />
    </linearGradient>

    <!-- Glowing Cyan/Teal Circuit Gradient -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>

    <!-- Central Glowing Core Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80f7ff" />
      <stop offset="40%" stop-color="#00d2ff" />
      <stop offset="85%" stop-color="#0077b6" />
      <stop offset="100%" stop-color="#051e3e" />
    </radialGradient>

    <!-- Outer Soft Glow Effect -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#002b49" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#subtleDropShadow)">

    <!-- ========================================== -->
    <!-- MAIN MEDICAL STETHOSCOPE CROSS OUTLINE FRAME -->
    <!-- ========================================== -->

    <!-- Outer Navy Stethoscope Frame Body -->
    <!-- Top Arm: X 280..520, Y 120..280 -->
    <!-- Right Arm: X 520..680, Y 280..520 -->
    <!-- Bottom Arm: X 280..520, Y 520..680 -->
    <!-- Left Arm: X 120..280, Y 280..520 -->
    
    <!-- Smooth Stethoscope Outer & Inner Contour -->
    <path d="
      M 320,130 
      A 25,25 0 0,1 345,105 
      L 455,105 
      A 25,25 0 0,1 480,130 
      L 480,270 
      A 10,10 0 0,0 490,280 
      L 630,280 
      A 25,25 0 0,1 655,305 
      L 655,415 
      A 25,25 0 0,1 630,440 
      L 490,440 
      A 10,10 0 0,0 480,450 
      L 480,590 
      A 25,25 0 0,1 455,615 
      L 345,615 
      A 25,25 0 0,1 320,590 
      L 320,450 
      A 10,10 0 0,0 310,440 
      L 170,440 
      A 25,25 0 0,1 145,415 
      L 145,305 
      A 25,25 0 0,1 170,280 
      L 310,280 
      A 10,10 0 0,0 320,270 
      Z"
      fill="#06182c"
      stroke="#0c2d54"
      stroke-width="18"
      stroke-linejoin="round"
    />

    <!-- Stethoscope Metal/Tube Outer Bezel Line -->
    <path d="
      M 320,130 
      A 25,25 0 0,1 345,105 
      L 455,105 
      A 25,25 0 0,1 480,130 
      L 480,270 
      A 10,10 0 0,0 490,280 
      L 630,280 
      A 25,25 0 0,1 655,305 
      L 655,415 
      A 25,25 0 0,1 630,440 
      L 490,440 
      A 10,10 0 0,0 480,450 
      L 480,590 
      A 25,25 0 0,1 455,615 
      L 345,615 
      A 25,25 0 0,1 320,590 
      L 320,450 
      A 10,10 0 0,0 310,440 
      L 170,440 
      A 25,25 0 0,1 145,415 
      L 145,305 
      A 25,25 0 0,1 170,280 
      L 310,280 
      A 10,10 0 0,0 320,270 
      Z"
      fill="none"
      stroke="url(#circuitGrad)"
      stroke-width="4"
      opacity="0.7"
    />

    <!-- STETHOSCOPE EAR-TIPS AT THE 4 ARMS -->
    <!-- Top Arm Ear Tips -->
    <g transform="translate(400, 105)">
      <!-- Left Ear Tip -->
      <path d="M -55,0 C -55,-25 -75,-35 -90,-20 C -100,-10 -95,15 -75,20 C -60,22 -55,10 -55,0 Z" fill="#041220" stroke="#00d2ff" stroke-width="4" />
      <circle cx="-80" cy="-5" r="10" fill="#00d2ff" />
      <!-- Right Ear Tip -->
      <path d="M 55,0 C 55,-25 75,-35 90,-20 C 100,-10 95,15 75,20 C 60,22 55,10 55,0 Z" fill="#041220" stroke="#00d2ff" stroke-width="4" />
      <circle cx="80" cy="-5" r="10" fill="#00d2ff" />
    </g>

    <!-- Bottom Arm Ear Tips -->
    <g transform="translate(400, 615)">
      <!-- Left Ear Tip -->
      <path d="M -55,0 C -55,25 -75,35 -90,20 C -100,10 -95,-15 -75,-20 C -60,-22 -55,-10 -55,0 Z" fill="#041220" stroke="#00d2ff" stroke-width="4" />
      <circle cx="-80" cy="5" r="10" fill="#00d2ff" />
      <!-- Right Ear Tip -->
      <path d="M 55,0 C 55,25 75,35 90,20 C 100,10 95,-15 75,-20 C 60,-22 55,-10 55,0 Z" fill="#041220" stroke="#00d2ff" stroke-width="4" />
      <circle cx="80" cy="5" r="10" fill="#00d2ff" />
    </g>

    <!-- Left Arm Ear Tips -->
    <g transform="translate(145, 360)">
      <!-- Top Ear Tip -->
      <path d="M 0,-55 C -25,-55 -35,-75 -20,-90 C -10,-100 15,-95 20,-75 C 22,-60 10,-55 0,-55 Z" fill="#041220" stroke="#00d2ff" stroke-width="4" />
      <circle cx="-5" cy="-80" r="10" fill="#00d2ff" />
      <!-- Bottom Ear Tip -->
      <path d="M 0,55 C -25,55 -35,75 -20,90 C -10,100 15,95 20,75 C 22,60 10,55 0,55 Z" fill="#041220" stroke="#00d2ff" stroke-width="4" />
      <circle cx="-5" cy="80" r="10" fill="#00d2ff" />
    </g>

    <!-- Right Arm Ear Tips -->
    <g transform="translate(655, 360)">
      <!-- Top Ear Tip -->
      <path d="M 0,-55 C 25,-55 35,-75 20,-90 C 10,-100 -15,-95 -20,-75 C -22,-60 -10,-55 0,-55 Z" fill="#041220" stroke="#00d2ff" stroke-width="4" />
      <circle cx="5" cy="-80" r="10" fill="#00d2ff" />
      <!-- Bottom Ear Tip -->
      <path d="M 0,55 C 25,55 35,75 20,90 C 10,100 -15,95 -20,75 C -22,60 -10,55 0,55 Z" fill="#041220" stroke="#00d2ff" stroke-width="4" />
      <circle cx="5" cy="80" r="10" fill="#00d2ff" />
    </g>


    <!-- ========================================== -->
    <!-- INTERNAL AI NEURAL NETWORK & CIRCUIT TRACES -->
    <!-- ========================================== -->
    <g stroke="url(#circuitGrad)" stroke-linecap="round" stroke-linejoin="round" fill="none">

      <!-- Main Trunk Traces from Center Core (400,360) -->
      <!-- TOP ARM CIRCUITS -->
      <path d="M 370,300 L 350,220 L 370,170 L 350,130" stroke-width="5" />
      <path d="M 430,300 L 450,220 L 430,170 L 450,130" stroke-width="5" />
      <path d="M 400,280 L 400,200 L 380,160 M 400,200 L 420,160" stroke-width="4" />

      <!-- Cross branches in top arm -->
      <path d="M 350,220 L 400,200 M 400,200 L 450,220" stroke-width="3" />
      <path d="M 370,170 L 430,170" stroke-width="3.5" />
      <path d="M 340,180 L 370,220" stroke-width="3" />
      <path d="M 460,180 L 430,220" stroke-width="3" />

      <!-- BOTTOM ARM CIRCUITS -->
      <path d="M 370,420 L 350,500 L 370,550 L 350,590" stroke-width="5" />
      <path d="M 430,420 L 450,500 L 430,550 L 450,590" stroke-width="5" />
      <path d="M 400,440 L 400,520 L 380,560 M 400,520 L 420,560" stroke-width="4" />

      <!-- Cross branches in bottom arm -->
      <path d="M 350,500 L 400,520 M 400,520 L 450,500" stroke-width="3" />
      <path d="M 370,550 L 430,550" stroke-width="3.5" />
      <path d="M 340,540 L 370,500" stroke-width="3" />
      <path d="M 460,540 L 430,500" stroke-width="3" />

      <!-- LEFT ARM CIRCUITS -->
      <path d="M 340,330 L 260,310 L 210,330 L 170,310" stroke-width="5" />
      <path d="M 340,390 L 260,410 L 210,390 L 170,410" stroke-width="5" />
      <path d="M 320,360 L 240,360 L 200,340 M 240,360 L 200,380" stroke-width="4" />

      <!-- Cross branches in left arm -->
      <path d="M 260,310 L 240,360 M 240,360 L 260,410" stroke-width="3" />
      <path d="M 210,330 L 210,390" stroke-width="3.5" />
      <path d="M 220,300 L 260,330" stroke-width="3" />
      <path d="M 220,420 L 260,390" stroke-width="3" />

      <!-- RIGHT ARM CIRCUITS -->
      <path d="M 460,330 L 540,310 L 590,330 L 630,310" stroke-width="5" />
      <path d="M 460,390 L 540,410 L 590,390 L 630,410" stroke-width="5" />
      <path d="M 480,360 L 560,360 L 600,340 M 560,360 L 600,380" stroke-width="4" />

      <!-- Cross branches in right arm -->
      <path d="M 540,310 L 560,360 M 560,360 L 540,410" stroke-width="3" />
      <path d="M 590,330 L 590,390" stroke-width="3.5" />
      <path d="M 580,300 L 540,330" stroke-width="3" />
      <path d="M 580,420 L 540,390" stroke-width="3" />

    </g>

    <!-- NEURAL CIRCUIT NODES (CIRCULAR DOTS) -->
    <g fill="#00f0ff" stroke="#031b33" stroke-width="2.5" filter="url(#glowFilter)">

      <!-- Top Arm Nodes -->
      <circle cx="350" cy="220" r="9" />
      <circle cx="450" cy="220" r="9" />
      <circle cx="370" cy="170" r="8" />
      <circle cx="430" cy="170" r="8" />
      <circle cx="400" cy="200" r="10" />
      <circle cx="380" cy="160" r="7" />
      <circle cx="420" cy="160" r="7" />
      <circle cx="350" cy="130" r="8" />
      <circle cx="450" cy="130" r="8" />

      <!-- Bottom Arm Nodes -->
      <circle cx="350" cy="500" r="9" />
      <circle cx="450" cy="500" r="9" />
      <circle cx="370" cy="550" r="8" />
      <circle cx="430" cy="550" r="8" />
      <circle cx="400" cy="520" r="10" />
      <circle cx="380" cy="560" r="7" />
      <circle cx="420" cy="560" r="7" />
      <circle cx="350" cy="590" r="8" />
      <circle cx="450" cy="590" r="8" />

      <!-- Left Arm Nodes -->
      <circle cx="260" cy="310" r="9" />
      <circle cx="260" cy="410" r="9" />
      <circle cx="210" cy="330" r="8" />
      <circle cx="210" cy="390" r="8" />
      <circle cx="240" cy="360" r="10" />
      <circle cx="200" cy="340" r="7" />
      <circle cx="200" cy="380" r="7" />
      <circle cx="170" cy="310" r="8" />
      <circle cx="170" cy="410" r="8" />

      <!-- Right Arm Nodes -->
      <circle cx="540" cy="310" r="9" />
      <circle cx="540" cy="410" r="9" />
      <circle cx="590" cy="330" r="8" />
      <circle cx="590" cy="390" r="8" />
      <circle cx="560" cy="360" r="10" />
      <circle cx="600" cy="340" r="7" />
      <circle cx="600" cy="380" r="7" />
      <circle cx="630" cy="310" r="8" />
      <circle cx="630" cy="410" r="8" />

    </g>


    <!-- ========================================== -->
    <!-- CENTRAL GLOWING AI CORE NODE -->
    <!-- ========================================== -->
    <g transform="translate(400, 360)">

      <!-- Outer Glow Ring Base -->
      <circle cx="0" cy="0" r="75" fill="#04172b" stroke="url(#circuitGrad)" stroke-width="8" filter="url(#glowFilter)" />
      
      <!-- Middle Concentric Tech Ring -->
      <circle cx="0" cy="0" r="58" fill="none" stroke="#00f0ff" stroke-width="4" stroke-dasharray="12,6" />
      <circle cx="0" cy="0" r="48" fill="#07203a" stroke="#00b4d8" stroke-width="3" />

      <!-- Inner Glowing Core Sphere -->
      <circle cx="0" cy="0" r="32" fill="url(#coreGlow)" filter="url(#glowFilter)" />
      <circle cx="0" cy="0" r="14" fill="#ffffff" opacity="0.9" />

      <!-- Central Core Radiating Synapse Lines -->
      <g stroke="#00f0ff" stroke-width="3">
        <line x1="0" y1="-32" x2="0" y2="-48" />
        <line x1="0" y1="32" x2="0" y2="48" />
        <line x1="-32" y1="0" x2="-48" y2="0" />
        <line x1="32" y1="0" x2="48" y2="0" />
        <line x1="-22" y1="-22" x2="-34" y2="-34" />
        <line x1="22" y1="-22" x2="34" y2="-34" />
        <line x1="-22" y1="22" x2="-34" y2="34" />
        <line x1="22" y1="22" x2="34" y2="34" />
      </g>

      <!-- Micro Synapse Dots around Core -->
      <circle cx="0" cy="-48" r="4" fill="#ffffff" />
      <circle cx="0" cy="48" r="4" fill="#ffffff" />
      <circle cx="-48" cy="0" r="4" fill="#ffffff" />
      <circle cx="48" cy="0" r="4" fill="#ffffff" />
      <circle cx="-34" cy="-34" r="3.5" fill="#00f0ff" />
      <circle cx="34" cy="-34" r="3.5" fill="#00f0ff" />
      <circle cx="-34" cy="34" r="3.5" fill="#00f0ff" />
      <circle cx="34" cy="34" r="3.5" fill="#00f0ff" />

    </g>

  </g>
</svg>
