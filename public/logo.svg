    <circle cx="236" cy="150" r="5" fill="#00ffff" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="276" cy="150" r="5" fill="#00ffff" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="220" cy="110" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="292" cy="110" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="256" cy="125" r="4.5" fill="#00e1ff" stroke="#02132b" stroke-width="1" />
    <circle cx="242" cy="92" r="5" fill="#00ffff" stroke="#ffffff" stroke-width="1" />
    <circle cx="270" cy="92" r="5" fill="#00ffff" stroke="#ffffff" stroke-width="1" />

    <!-- Bottom Arm Nodes -->
    <circle cx="236" cy="362" r="5" fill="#00ffff" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="276" cy="362" r="5" fill="#00ffff" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="220" cy="402" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="292" cy="402" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="256" cy="387" r="4.5" fill="#00e1ff" stroke="#02132b" stroke-width="1" />
    <circle cx="242" cy="420" r="5" fill="#00ffff" stroke="#ffffff" stroke-width="1" />
    <circle cx="270" cy="420" r="5" fill="#00ffff" stroke="#ffffff" stroke-width="1" />

    <!-- Right Arm Nodes -->
    <circle cx="362" cy="236" r="5" fill="#00ffff" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="362" cy="276" r="5" fill="#00ffff" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="402" cy="220" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="402" cy="292" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="387" cy="256" r="4.5" fill="#00e1ff" stroke="#02132b" stroke-width="1" />
    <circle cx="420" cy="242" r="5" fill="#00ffff" stroke="#ffffff" stroke-width="1" />
    <circle cx="420" cy="270" r="5" fill="#00ffff" stroke="#ffffff" stroke-width="1" />

