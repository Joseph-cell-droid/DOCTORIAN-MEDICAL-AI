    <!-- CENTER HUD CORE STRUCTURE -->
    <!-- Outer dashed tech ring -->
    <circle cx="256" cy="256" r="66" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="10 6" opacity="0.85" />
    
    <!-- Outer solid cyan ring -->
