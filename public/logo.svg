      <line x1="256" y1="190" x2="276" y2="150" />
      <line x1="236" y1="150" x2="220" y2="110" />
      <line x1="276" y1="150" x2="292" y2="110" />
      <line x1="236" y1="150" x2="256" y2="125" />
