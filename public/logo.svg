    <!-- Glowing Core Center -->
    <circle cx="256" cy="256" r="22" fill="url(#coreGlow)" />
    <circle cx="256" cy="256" r="9" fill="#ffffff" />
    <circle cx="256" cy="256" r="4" fill="#00d8ff" />
