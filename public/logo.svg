    <circle cx="256" cy="304" r="3" fill="#ffffff" />
    <circle cx="208" cy="256" r="3" fill="#ffffff" />
    <circle cx="304" cy="256" r="3" fill="#ffffff" />

    <!-- Inner Core Orb Base -->
