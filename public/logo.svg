<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow & Shadow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#00aaff" flood-opacity="0.35" />
    </filter>

    <!-- Cross Body Dark Gradient -->
    <linearGradient id="crossBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b18" />
      <stop offset="50%" stop-color="#081730" />
      <stop offset="100%" stop-color="#030914" />
    </linearGradient>

    <!-- Border Cyan Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="50%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Inner Core Orb Radial Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#00f0ff" />
      <stop offset="70%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#02132b" />
    </radialGradient>
  </defs>

  <!-- Outer Ambient Radial Glow behind the Cross -->
  <circle cx="256" cy="256" r="210" fill="#0088ff" opacity="0.12" filter="url(#cyanGlow)" />
  <circle cx="256" cy="256" r="140" fill="#00f0ff" opacity="0.15" filter="url(#cyanGlow)" />

  <!-- MAIN HIGH-TECH MEDICAL CROSS EMBLEM -->
  <g filter="url(#softShadow)">
    <!-- Outer Glow Outline Path -->
    <path d="
      M 208,66 
      H 304 
      A 12,12 0 0,1 316,78 
      V 184 
      A 12,12 0 0,0 328,196 
      H 434 
      A 12,12 0 0,1 446,208 
      V 304 
      A 12,12 0 0,1 434,316 
      H 328 
      A 12,12 0 0,0 316,328 
      V 434 
      A 12,12 0 0,1 304,446 
      H 208 
      A 12,12 0 0,1 196,434 
      V 328 
      A 12,12 0 0,0 184,316 
      H 78 
      A 12,12 0 0,1 66,304 
      V 208 
      A 12,12 0 0,1 78,196 
      H 184 
      A 12,12 0 0,0 196,184 
      V 78 
      A 12,12 0 0,1 208,66 
      Z" 
      fill="none" 
      stroke="#00f0ff" 
      stroke-width="10" 
      opacity="0.4"
      filter="url(#cyanGlow)"
    />

    <!-- Main Cross Body Fill -->
    <path d="
      M 208,66 
      H 304 
      A 12,12 0 0,1 316,78 
      V 184 
      A 12,12 0 0,0 328,196 
      H 434 
      A 12,12 0 0,1 446,208 
      V 304 
      A 12,12 0 0,1 434,316 
      H 328 
      A 12,12 0 0,0 316,328 
      V 434 
      A 12,12 0 0,1 304,446 
      H 208 
      A 12,12 0 0,1 196,434 
      V 328 
      A 12,12 0 0,0 184,316 
      H 78 
      A 12,12 0 0,1 66,304 
      V 208 
      A 12,12 0 0,1 78,196 
      H 184 
      A 12,12 0 0,0 196,184 
      V 78 
      A 12,12 0 0,1 208,66 
      Z" 
      fill="url(#crossBodyGrad)" 
      stroke="url(#borderGrad)" 
      stroke-width="5" 
    />

    <!-- Inner Metallic Inset Outline -->
    <path d="
      M 212,74 
      H 300 
      A 8,8 0 0,1 308,82 
      V 180 
      A 16,16 0 0,0 324,196 
      H 430 
      A 8,8 0 0,1 438,204 
      V 308 
      A 8,8 0 0,1 430,316 
      H 324 
      A 16,16 0 0,0 308,332 
      V 430 
      A 8,8 0 0,1 300,438 
      H 212 
      A 8,8 0 0,1 204,430 
      V 332 
      A 16,16 0 0,0 188,316 
      H 82 
      A 8,8 0 0,1 74,308 
      V 204 
      A 8,8 0 0,1 82,196 
      H 188 
      A 16,16 0 0,0 204,180 
      V 82 
      A 8,8 0 0,1 212,74 
      Z" 
      fill="none" 
      stroke="#00d2ff" 
      stroke-width="1.5" 
      opacity="0.6"
    />

