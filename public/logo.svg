      <circle cx="0" cy="0" r="14" fill="#041226" stroke="#00f0ff" stroke-width="3" />
      <circle cx="0" cy="0" r="7" fill="#020b18" stroke="#00a8ff" stroke-width="1.5" />
      <circle cx="0" cy="0" r="3.5" fill="#00f0ff" />
