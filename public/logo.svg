      <!-- BOTTOM ARM NEURAL BRANCHES -->
      <line x1="256" y1="322" x2="236" y2="362" />
      <line x1="256" y1="322" x2="276" y2="362" />
      <line x1="236" y1="362" x2="220" y2="402" />
      <line x1="276" y1="362" x2="292" y2="402" />
      <line x1="236" y1="362" x2="256" y2="387" />
      <line x1="276" y1="362" x2="256" y2="387" />
      <line x1="256" y1="387" x2="242" y2="420" />
      <line x1="256" y1="387" x2="270" y2="420" />
      <line x1="220" y1="402" x2="242" y2="420" />
      <line x1="292" y1="402" x2="270" y2="420" />
      <line x1="220" y1="402" x2="202" y2="434" />
      <line x1="292" y1="402" x2="310" y2="434" />

      <!-- RIGHT ARM NEURAL BRANCHES -->
      <line x1="322" y1="256" x2="362" y2="236" />
      <line x1="322" y1="256" x2="362" y2="276" />
      <line x1="362" y1="236" x2="402" y2="220" />
      <line x1="362" y1="276" x2="402" y2="292" />
      <line x1="362" y1="236" x2="387" y2="256" />
      <line x1="362" y1="276" x2="387" y2="256" />
      <line x1="387" y1="256" x2="420" y2="242" />
      <line x1="387" y1="256" x2="420" y2="270" />
      <line x1="402" y1="220" x2="420" y2="242" />
      <line x1="402" y1="292" x2="420" y2="270" />
      <line x1="402" y1="220" x2="434" y2="202" />
      <line x1="402" y1="292" x2="434" y2="310" />

      <!-- LEFT ARM NEURAL BRANCHES -->
      <line x1="190" y1="256" x2="150" y2="236" />
      <line x1="190" y1="256" x2="150" y2="276" />
      <line x1="150" y1="236" x2="110" y2="220" />
      <line x1="150" y1="276" x2="110" y2="292" />
      <line x1="150" y1="236" x2="125" y2="256" />
      <line x1="150" y1="276" x2="125" y2="256" />
      <line x1="125" y1="256" x2="92" y2="242" />
      <line x1="125" y1="256" x2="92" y2="270" />
      <line x1="110" y1="220" x2="92" y2="242" />
      <line x1="110" y1="292" x2="92" y2="270" />
      <line x1="110" y1="220" x2="78" y2="202" />
